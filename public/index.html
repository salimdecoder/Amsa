<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amsa</title>
<style>
  :root { --bg:#f5f6f0; --ink:#1b2a22; --green:#1f6b4a; --card:#ffffff; --muted:#5d6b63; --line:#dfe4da; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; }
  header { padding: 14px 16px; background: var(--green); color: #fff; font-weight: 600; font-size: 18px; }
  header small { display: block; font-weight: 400; font-size: 13px; opacity: .85; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
  .bot { background: var(--card); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .me { background: var(--green); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .err { background: #fdecea; border: 1px solid #f3c1bb; align-self: flex-start; }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 8px; }
  #chips button { border: 1px solid var(--green); background: transparent; color: var(--green); padding: 7px 12px; border-radius: 999px; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--card); border-top: 1px solid var(--line); }
  input { flex: 1; font-size: 16px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  form button { font-size: 16px; padding: 0 18px; border: 0; border-radius: 12px; background: var(--green); color: #fff; }
  button:disabled { opacity: .5; }
  :focus-visible { outline: 3px solid #f0b429; outline-offset: 2px; }
</style>
</head>
<body>
<header>Amsa<small>English · Hausa</small></header>
<div id="chat" aria-live="polite"></div>
<div id="chips">
  <button type="button">What can you help with?</button>
  <button type="button">Me za ka iya yi mini?</button>
</div>
<form id="form">
  <input id="input" placeholder="Type a message · Rubuta saƙo" autocomplete="off" aria-label="Message">
  <button id="send" type="submit">Send</button>
</form>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const chips = document.getElementById("chips");

let sessionId = null;
try { sessionId = localStorage.getItem("amsa_sid"); } catch (e) {}
if (!sessionId) {
  sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
  try { localStorage.setItem("amsa_sid", sessionId); } catch (e) {}
}

function add(text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

add("Hello, I'm Amsa. Ask me anything in English or Hausa.\nSannu, ni ce Amsa. Ka iya tambaya a Turanci ko Hausa.", "bot");

async function ask(text) {
  chips.style.display = "none";
  add(text, "me");
  send.disabled = true;
  const wait = add("…", "bot");
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, message: text })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Request failed");
    wait.textContent = data.reply;
  } catch (e) {
    wait.className = "msg err";
    wait.textContent = e.message || "Connection problem. Please try again.";
  }
  send.disabled = false;
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const t = input.value.trim();
  if (!t || send.disabled) return;
  input.value = "";
  ask(t);
});
chips.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => ask(b.textContent)));
</script>
</body>
</html>
